name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every week to detect flakiness and broken dependencies
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup ROS environment
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gnupg lsb-release ubuntu-keyring
        curl -sSL https://repo.ros2.org/ros.key | sudo tee /usr/share/keyrings/ros-archive-keyring.gpg > /dev/null
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
        sudo apt-get update
    
    - name: Install build dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          python3-colcon-common-extensions \
          python3-rosdep \
          ros-jazzy-ros-core
    
    - name: Install package dependencies
      run: |
        source /opt/ros/jazzy/setup.bash
        sudo rosdep init || true
        rosdep update
        rosdep install --from-paths . --ignore-src -y --rosdistro jazzy
      working-directory: ${{ github.workspace }}
      shell: bash
    
    - name: Build with colcon
      run: |
        set -e
        source /opt/ros/jazzy/setup.bash
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
      working-directory: ${{ github.workspace }}
      shell: bash
    
    - name: Run tests
      run: |
        set -e
        source /opt/ros/jazzy/setup.bash
        source install/local_setup.bash
        colcon test --packages-up-to ddsm210_hardware_interface
      working-directory: ${{ github.workspace }}
      shell: bash
      continue-on-error: false
    
    - name: Show test results
      if: always()
      run: |
        source /opt/ros/jazzy/setup.bash
        colcon test-result --all --verbose
      working-directory: ${{ github.workspace }}
      shell: bash
