name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every week to detect flakiness and broken dependencies
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup ROS environment
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C1CF6E31E6BABE4D
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository universe
        sudo apt-get update
    
    - name: Install ROS 2 Jazzy
      run: |
        sudo apt-get install -y ros-jazzy-ros-core
    
    - name: Install build dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          cmake \
          git \
          python3-colcon-common-extensions \
          python3-rosdep
    
    - name: Install package dependencies
      run: |
        source /opt/ros/jazzy/setup.bash
        sudo rosdep init || true
        rosdep update
        rosdep install --from-paths . --ignore-src -y
      working-directory: ${{ github.workspace }}
    
    - name: Build with colcon
      run: |
        source /opt/ros/jazzy/setup.bash
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
      working-directory: ${{ github.workspace }}
    
    - name: Run tests
      run: |
        source /opt/ros/jazzy/setup.bash
        source install/local_setup.bash
        colcon test --packages-up-to ddsm210_hardware_interface
      working-directory: ${{ github.workspace }}
      continue-on-error: false
    
    - name: Show test results
      if: always()
      run: |
        colcon test-result --all --verbose
      working-directory: ${{ github.workspace }}
